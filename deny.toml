[graph]
# Desktop triples only: tauri pulls reqwest for iOS/Android, which we never build.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
# Unmaintained notices only for crates we depend on directly; transitive ones (zbus internals in
# Tauri's Linux stack) are tracked through Dependabot and can only be fixed upstream.
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is a build-time dependency of gtk-rs 0.18 (Tauri's Linux stack); no maintained release of that stack exists yet" },
]

[licenses]
# Every entry must be compatible with distributing the combined binary under GPL-3.0-or-later.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "GPL-3.0-or-later",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# The no-network guarantee (architecture §12): no HTTP, WebSocket, QUIC or TLS stack may enter the graph.
deny = [
  { crate = "reqwest", reason = "HTTP client" },
  { crate = "hyper", reason = "HTTP client/server" },
  { crate = "hyper-util", reason = "HTTP client/server" },
  { crate = "h2", reason = "HTTP/2" },
  { crate = "h3", reason = "HTTP/3" },
  { crate = "ureq", reason = "HTTP client" },
  { crate = "isahc", reason = "HTTP client" },
  { crate = "curl", reason = "HTTP client" },
  { crate = "curl-sys", reason = "HTTP client" },
  { crate = "surf", reason = "HTTP client" },
  { crate = "attohttpc", reason = "HTTP client" },
  { crate = "tungstenite", reason = "WebSocket" },
  { crate = "tokio-tungstenite", reason = "WebSocket" },
  { crate = "async-tungstenite", reason = "WebSocket" },
  { crate = "quinn", reason = "QUIC" },
  { crate = "rustls", reason = "TLS" },
  { crate = "native-tls", reason = "TLS" },
  { crate = "openssl", reason = "TLS" },
  { crate = "openssl-sys", reason = "TLS" },
  { crate = "tauri-plugin-http", reason = "webview HTTP client" },
  { crate = "tauri-plugin-websocket", reason = "WebSocket" },
  { crate = "tauri-plugin-upload", reason = "HTTP upload/download" },
  { crate = "tauri-plugin-updater", reason = "update checks over HTTPS" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
