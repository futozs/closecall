[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/lists",
  "crates/engine",
  "crates/platform-fake",
  "crates/platform-macos",
  "crates/platform-windows",
  "crates/platform-linux",
  "app/src-tauri",
]
default-members = ["crates/core", "crates/lists", "crates/engine", "crates/platform-fake"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/futozs/closecall"
authors = ["futozs"]

[workspace.dependencies]
closecall-core = { path = "crates/core" }
closecall-lists = { path = "crates/lists" }
closecall-engine = { path = "crates/engine" }
closecall-platform-fake = { path = "crates/platform-fake" }
closecall-platform-macos = { path = "crates/platform-macos" }
closecall-platform-windows = { path = "crates/platform-windows" }
closecall-platform-linux = { path = "crates/platform-linux" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.2.1"
schemars = "1.2.3"
thiserror = "2.0.21"
regex = "1.13.1"
globset = "0.4.21"
url = { version = "2.5.8", features = ["serde"] }
psl = "2.1.255"
unicode-normalization = "0.1"
lz4_flex = "0.14.2"
crossbeam-channel = "0.5.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
dirs = "7.0.0"
sys-locale = "0.3.2"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
insta = { version = "1.49.0", features = ["yaml"] }
proptest = "1.12.0"
libc = "0.2"

objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-application-services = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-io-kit = "0.3.2"
objc2-osa-kit = "0.3.2"

tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-build = "2.7.4"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-notification = "2.8.1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
disallowed_types = "deny"
dbg_macro = "deny"
print_stdout = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
