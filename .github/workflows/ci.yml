name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  BUN_VERSION: 1.3.14

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: scripts/ci/install-linux-deps.sh
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # tauri::generate_context! embeds app/dist, so the app crate does not compile without it.
      - name: Build frontend
        run: bun run build
        working-directory: app
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run check
        working-directory: app
      - name: Biome
        run: bunx --no-install biome ci .
      - name: Vitest
        run: bunx --no-install vitest run
        working-directory: app
      - name: Install Playwright Chromium
        run: bunx --no-install playwright install --with-deps chromium
        working-directory: app
      - name: Playwright smoke
        run: bunx --no-install playwright test
        working-directory: app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  bindings:
    name: Generated bindings drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Regenerate TypeScript bindings and JSON schema
        run: cargo test -p closecall-core --locked
      - name: Fail on uncommitted changes
        run: |
          changes=$(git status --porcelain --untracked-files=all -- app/src/bindings schema)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- app/src/bindings schema
            echo "::error::app/src/bindings or schema/ is out of date. Run 'cargo test -p closecall-core' and commit the result."
            exit 1
          fi

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  no-network:
    name: No network at runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux system libraries and strace
        run: scripts/ci/install-linux-deps.sh strace
      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor; `unshare -rn` needs them.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build frontend
        run: bun run build
        working-directory: app
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build test binaries
        run: cargo test --workspace --locked --no-run --message-format=json > "$RUNNER_TEMP/test-binaries.json"
      - name: Run test binaries under strace and without a network namespace
        run: scripts/ci/no-network.sh "$RUNNER_TEMP/test-binaries.json"
        env:
          NO_NETWORK_LOG_DIR: ${{ runner.temp }}/no-network
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: no-network-strace-logs
          path: ${{ runner.temp }}/no-network
          if-no-files-found: ignore
          retention-days: 14

  i18n:
    name: Locale keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun scripts/ci/check-i18n.ts
