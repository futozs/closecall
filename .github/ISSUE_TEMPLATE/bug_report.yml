name: Bug report
description: Something did not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste private URLs, window titles or file paths:
        replace them with a placeholder such as `https://<my bank>/...`.
        Security problems go through the Security tab, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Start a screen share in ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Close Call version
      placeholder: 0.1.0 or a commit hash
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: macOS 15.3, Windows 11 24H2, Ubuntu 24.04 (X11) ...
    validations:
      required: true
  - type: input
    id: apps
    attributes:
      label: Browsers or apps involved, with versions
      placeholder: Chrome 142, Preview, Zoom 6.4 ...
  - type: textarea
    id: diag
    attributes:
      label: Output of `closecall diag`
      description: The report is redacted (no titles, URLs or paths). Check it before pasting anyway.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private URLs, titles and file paths from this report.
          required: true
