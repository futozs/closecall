[package]
name = "closecall-platform-macos"
description = "macOS adapter: AX windows and documents, browser tabs over Apple Events, share/lock/sleep signals."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
closecall-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
serde.workspace = true
serde_json.workspace = true
lz4_flex.workspace = true
dirs.workspace = true
libc.workspace = true
tracing.workspace = true
block2 = "0.6.2"
objc2.workspace = true
objc2-foundation = { workspace = true, features = [
  "NSAppleEventDescriptor",
  "NSAppleScript",
  "NSArray",
  "NSDate",
  "NSDictionary",
  "NSDistributedNotificationCenter",
  "NSError",
  "NSNotification",
  "NSOperation",
  "NSString",
  "NSURL",
  "NSValue",
  "block2",
  "objc2-core-services",
] }
objc2-app-kit = { workspace = true, features = ["NSRunningApplication", "NSWorkspace"] }
objc2-application-services = { workspace = true, features = [
  "AXError",
  "AXUIElement",
  "HIServices",
  "libc",
] }
objc2-core-foundation = { workspace = true, features = [
  "CFArray",
  "CFDictionary",
  "CFNumber",
  "CFRunLoop",
  "CFString",
] }
objc2-core-graphics = { workspace = true, features = [
  "CGDirectDisplay",
  "CGDisplayConfiguration",
  "CGError",
  "CGEventSource",
  "CGEventTypes",
  "libc",
] }
objc2-io-kit = { workspace = true, features = ["libc"] }
objc2-core-services = { version = "0.3.2", default-features = false, features = [
  "std",
  "AE",
  "AEDataModel",
  "AppleEvents",
] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = [
  "std",
  "AudioHardware",
] }

[dev-dependencies]
lz4_flex.workspace = true

[lints]
workspace = true
